<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devotchi Case Design Gallery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
  }
  header {
    background: #16213e;
    padding: 20px 32px;
    border-bottom: 2px solid #0f3460;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 24px;
    color: #e94560;
    font-weight: 700;
  }
  header h1 span { color: #e0e0e0; font-weight: 300; }

  .tab-bar {
    display: flex;
    gap: 4px;
    background: #16213e;
    padding: 0 32px 12px;
  }
  .tab {
    padding: 10px 24px;
    border: none;
    background: transparent;
    color: #8899aa;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
  }
  .tab:hover { color: #e0e0e0; }
  .tab.active { color: #e94560; border-bottom-color: #e94560; }

  .gallery-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 32px;
  }

  /* Card grid */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 20px;
  }
  .card {
    background: #16213e;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    border: 1px solid #0f3460;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    border-color: #e94560;
  }
  .card .preview {
    background: #fff;
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card .preview img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 8px;
  }
  .card .preview pre {
    font-size: 6px;
    line-height: 1.1;
    color: #333;
    padding: 8px;
    overflow: hidden;
    max-height: 100%;
    white-space: pre;
    font-family: 'Courier New', monospace;
  }
  .card .info {
    padding: 16px;
  }
  .card .info h3 {
    font-size: 16px;
    color: #e94560;
    margin-bottom: 4px;
  }
  .card .info .dims {
    font-size: 12px;
    color: #8899aa;
  }
  .card .info .desc {
    font-size: 13px;
    color: #aab;
    margin-top: 8px;
    line-height: 1.4;
  }

  /* Modal / Lightbox */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #16213e;
    border-radius: 16px;
    max-width: 95vw;
    max-height: 95vh;
    width: 1200px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #0f3460;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid #0f3460;
  }
  .modal-header h2 {
    font-size: 20px;
    color: #e94560;
  }
  .modal-header .counter {
    color: #8899aa;
    font-size: 14px;
  }
  .modal-close {
    background: none;
    border: none;
    color: #8899aa;
    font-size: 28px;
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
  }
  .modal-close:hover { color: #e94560; }

  .modal-body {
    flex: 1;
    overflow: auto;
    display: flex;
    flex-direction: column;
  }
  .modal-tabs {
    display: flex;
    gap: 2px;
    padding: 12px 24px 0;
  }
  .modal-tab {
    padding: 8px 20px;
    border: none;
    background: #0f3460;
    color: #8899aa;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px 8px 0 0;
    transition: all 0.2s;
  }
  .modal-tab.active { background: #1a1a2e; color: #e94560; }

  .modal-content {
    flex: 1;
    overflow: auto;
    background: #fff;
    margin: 0 24px 24px;
    border-radius: 0 8px 8px 8px;
  }
  .modal-content.ascii-view {
    background: #1a1a2e;
    padding: 16px;
  }
  .modal-content.ascii-view pre {
    font-size: 11px;
    line-height: 1.3;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    white-space: pre;
  }
  .modal-content img {
    width: 100%;
    height: auto;
    display: block;
  }

  .modal-nav {
    display: flex;
    justify-content: space-between;
    padding: 0 24px 16px;
  }
  .nav-btn {
    padding: 10px 24px;
    border: 1px solid #0f3460;
    background: #16213e;
    color: #e0e0e0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
  }
  .nav-btn:hover { border-color: #e94560; color: #e94560; }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  /* Keyboard hints */
  .kbd-hints {
    text-align: center;
    padding: 8px;
    color: #556;
    font-size: 12px;
  }
  kbd {
    background: #0f3460;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    color: #aab;
  }
</style>
</head>
<body>

<header>
  <h1>Devotchi <span>Case Design Gallery</span></h1>
  <div class="kbd-hints">
    <kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;
    <kbd>Esc</kbd> close &nbsp;
    <kbd>T</kbd> toggle SVG/ASCII
  </div>
</header>

<div class="tab-bar">
  <button class="tab active" data-category="all">All Designs</button>
  <button class="tab" data-category="desktop">Desktop (6)</button>
  <button class="tab" data-category="portable">Portable (10)</button>
</div>

<div class="gallery-container">
  <div class="card-grid" id="cardGrid"></div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Design Name</h2>
      <div>
        <span class="counter" id="modalCounter">1 / 16</span>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-tabs">
        <button class="modal-tab active" data-view="svg">SVG Drawing</button>
        <button class="modal-tab" data-view="ascii">ASCII Concept</button>
      </div>
      <div class="modal-content" id="modalContent"></div>
    </div>
    <div class="modal-nav">
      <button class="nav-btn" id="prevBtn">← Previous</button>
      <button class="nav-btn" id="nextBtn">Next →</button>
    </div>
  </div>
</div>

<script>
const designs = [
  // Desktop designs
  { id: 'd01', name: 'Upright Easel', category: 'desktop', dims: '~85×65mm, 65° tilt',
    desc: 'Flat slab on a detachable triangular stand. Portrait orientation, minimal desk monitor aesthetic.',
    svg: 'desktop/svg/01_easel.svg', ascii: 'desktop/concepts/01_easel.txt' },
  { id: 'd02', name: 'Wedge Console', category: 'desktop', dims: '155×100mm, 15° angle',
    desc: 'Low-profile landscape wedge. Bloomberg terminal vibes with angled top surface.',
    svg: 'desktop/svg/02_wedge.svg', ascii: 'desktop/concepts/02_wedge.txt' },
  { id: 'd03', name: 'Floating Orb', category: 'desktop', dims: '80mm egg, 65mm base',
    desc: 'Egg-shaped head on a cylindrical pedestal. Most "Tamagotchi" of the desktop designs.',
    svg: 'desktop/svg/03_orb.svg', ascii: 'desktop/concepts/03_orb.txt' },
  { id: 'd04', name: 'Monolith Slab', category: 'desktop', dims: '84×135mm, 15mm thin',
    desc: 'Thin portrait tablet with integrated kickstand. Surface Pro style.',
    svg: 'desktop/svg/04_monolith.svg', ascii: 'desktop/concepts/04_monolith.txt' },
  { id: 'd05', name: 'Retro TV', category: 'desktop', dims: '165×110mm, 65mm deep',
    desc: 'Chunky CRT-shaped enclosure with antenna stubs. 70s nostalgia.',
    svg: 'desktop/svg/05_retro_tv.svg', ascii: 'desktop/concepts/05_retro_tv.txt' },
  { id: 'd06', name: 'Hex Tower', category: 'desktop', dims: '55mm hex, 120mm tall',
    desc: 'Hexagonal prism with dedicated facets for screen, buttons, speaker. Geometric desk art.',
    svg: 'desktop/svg/06_hex_tower.svg', ascii: 'desktop/concepts/06_hex_tower.txt' },

  // Portable designs
  { id: 'p01', name: 'Classic Egg', category: 'portable', dims: '~70×55×15mm',
    desc: 'Original Tamagotchi-inspired egg shape. Screen in upper half, buttons below, lanyard hole at top.',
    svg: 'portable/svg/01_classic_egg.svg', ascii: 'portable/concepts/01_classic_egg.txt' },
  { id: 'p02', name: 'GameBoy Micro', category: 'portable', dims: '~95×55×16mm',
    desc: 'Landscape handheld gaming device. Two-hand grip with buttons flanking the screen.',
    svg: 'portable/svg/02_gameboy_micro.svg', ascii: 'portable/concepts/02_gameboy_micro.txt' },
  { id: 'p03', name: 'Pebble', category: 'portable', dims: '~62×50×16mm',
    desc: 'Smartwatch-inspired rounded rectangle. Clean front face with side buttons like watch pushers.',
    svg: 'portable/svg/03_pebble.svg', ascii: 'portable/concepts/03_pebble.txt' },
  { id: 'p04', name: 'Clamshell', category: 'portable', dims: '~65×60×20mm closed',
    desc: 'Folds in half to protect screen. Opens to reveal display and buttons.',
    svg: 'portable/svg/04_clamshell.svg', ascii: 'portable/concepts/04_clamshell.txt' },
  { id: 'p05', name: 'Keychain Pod', category: 'portable', dims: '~55×55×18mm',
    desc: 'Ultra-compact rounded square with carabiner loop. Clips onto keys or bag.',
    svg: 'portable/svg/05_keychain_pod.svg', ascii: 'portable/concepts/05_keychain_pod.txt' },
  { id: 'p06', name: 'Pager', category: 'portable', dims: '~80×55×18mm',
    desc: '90s beeper aesthetic with belt clip. Slight wedge taper, curved back for comfort.',
    svg: 'portable/svg/06_pager.svg', ascii: 'portable/concepts/06_pager.txt' },
  { id: 'p07', name: 'Zippo', category: 'portable', dims: '~65×45×18mm',
    desc: 'Flip-lid reveals screen. Decorative front plate when closed. Very pocket-friendly.',
    svg: 'portable/svg/07_zippo.svg', ascii: 'portable/concepts/07_zippo.txt' },
  { id: 'p08', name: 'Badge', category: 'portable', dims: '~90×60×12mm',
    desc: 'Lanyard-mounted ID badge form factor. Thin profile, hangs from neck like conference badge.',
    svg: 'portable/svg/08_badge.svg', ascii: 'portable/concepts/08_badge.txt' },
  { id: 'p09', name: 'Brick', category: 'portable', dims: '~65×50×22mm',
    desc: 'Chunky fidget-friendly brick. Extra rounded, textured grips, satisfying to hold.',
    svg: 'portable/svg/09_brick.svg', ascii: 'portable/concepts/09_brick.txt' },
  { id: 'p10', name: 'Capsule', category: 'portable', dims: '~90×48×16mm',
    desc: 'Pill-shaped landscape design. Semicircle ends, smooth all around. Palm-friendly grip.',
    svg: 'portable/svg/10_capsule.svg', ascii: 'portable/concepts/10_capsule.txt' },
];

let currentCategory = 'all';
let filteredDesigns = [...designs];
let currentIndex = 0;
let currentView = 'svg';
const contentCache = {};

// --- Tab filtering ---
document.querySelectorAll('.tab-bar .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab-bar .tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentCategory = tab.dataset.category;
    renderGrid();
  });
});

// --- Render card grid ---
function renderGrid() {
  filteredDesigns = currentCategory === 'all'
    ? [...designs]
    : designs.filter(d => d.category === currentCategory);

  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';

  filteredDesigns.forEach((d, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="preview" id="preview-${d.id}">
        <img src="${d.svg}" alt="${d.name}" onerror="this.parentElement.innerHTML='<div style=\\'color:#666;font-size:14px;\\'>SVG preview</div>'">
      </div>
      <div class="info">
        <h3>${d.category === 'desktop' ? '🖥' : '📱'} ${d.name}</h3>
        <div class="dims">${d.dims}</div>
        <div class="desc">${d.desc}</div>
      </div>
    `;
    card.addEventListener('click', () => openModal(i));
    grid.appendChild(card);
  });
}

// --- Modal ---
async function fetchContent(url) {
  if (contentCache[url]) return contentCache[url];
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('Not found');
    const text = await resp.text();
    contentCache[url] = text;
    return text;
  } catch {
    return null;
  }
}

async function showContent() {
  const d = filteredDesigns[currentIndex];
  const el = document.getElementById('modalContent');

  document.querySelectorAll('.modal-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === currentView);
  });

  if (currentView === 'svg') {
    el.className = 'modal-content';
    el.innerHTML = `<img src="${d.svg}" alt="${d.name}" style="background:#fff">`;
  } else {
    el.className = 'modal-content ascii-view';
    const text = await fetchContent(d.ascii);
    el.innerHTML = `<pre>${text || 'ASCII file not found.'}</pre>`;
  }
}

function openModal(index) {
  currentIndex = index;
  currentView = 'svg';
  updateModal();
  document.getElementById('modal').classList.add('active');
}

function updateModal() {
  const d = filteredDesigns[currentIndex];
  document.getElementById('modalTitle').textContent =
    `${d.category === 'desktop' ? '🖥' : '📱'} ${d.name}`;
  document.getElementById('modalCounter').textContent =
    `${currentIndex + 1} / ${filteredDesigns.length}`;
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').disabled = currentIndex === filteredDesigns.length - 1;
  showContent();
}

document.getElementById('modalClose').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('active');
});
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal'))
    document.getElementById('modal').classList.remove('active');
});
document.getElementById('prevBtn').addEventListener('click', () => {
  if (currentIndex > 0) { currentIndex--; updateModal(); }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (currentIndex < filteredDesigns.length - 1) { currentIndex++; updateModal(); }
});

document.querySelectorAll('.modal-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    currentView = tab.dataset.view;
    showContent();
  });
});

// --- Keyboard navigation ---
document.addEventListener('keydown', e => {
  const modal = document.getElementById('modal');
  if (!modal.classList.contains('active')) return;

  if (e.key === 'Escape') modal.classList.remove('active');
  if (e.key === 'ArrowLeft' && currentIndex > 0) { currentIndex--; updateModal(); }
  if (e.key === 'ArrowRight' && currentIndex < filteredDesigns.length - 1) { currentIndex++; updateModal(); }
  if (e.key === 't' || e.key === 'T') {
    currentView = currentView === 'svg' ? 'ascii' : 'svg';
    showContent();
  }
});

// Init
renderGrid();
</script>

</body>
</html>
