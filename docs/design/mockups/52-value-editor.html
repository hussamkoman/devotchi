<!doctype html><html><head><meta charset="utf-8"><title>Devotchi mockup: 52-value-editor</title><meta name="viewport" content="width=320"><style>

.sub{font:500 14px/17px Figtree;color:#4B5160;margin-top:1px}
svg{display:block;flex:none}
