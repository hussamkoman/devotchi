<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Devotchi Case Design Gallery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    background: #16213e;
    padding: 20px 32px;
    border-bottom: 2px solid #0f3460;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 24px;
    color: #e94560;
    font-weight: 700;
  }
  header h1 span { color: #e0e0e0; font-weight: 300; }

  .tab-bar {
    display: flex;
    gap: 4px;
    background: #16213e;
    padding: 0 32px 12px;
  }
  .tab {
    padding: 10px 24px;
    border: none;
    background: transparent;
    color: #8899aa;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
    min-height: 44px;
  }
  .tab:hover { color: #e0e0e0; }
  .tab.active { color: #e94560; border-bottom-color: #e94560; }

  .gallery-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 32px;
  }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 20px;
  }
  .card {
    background: #16213e;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    border: 1px solid #0f3460;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    border-color: #e94560;
  }
  .card .preview {
    background: #fff;
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card .preview img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 8px;
  }
  .card .info {
    padding: 16px;
  }
  .card .info h3 {
    font-size: 16px;
    color: #e94560;
    margin-bottom: 4px;
  }
  .card .info .dims {
    font-size: 12px;
    color: #8899aa;
  }
  .card .info .desc {
    font-size: 13px;
    color: #aab;
    margin-top: 8px;
    line-height: 1.4;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #16213e;
    border-radius: 16px;
    max-width: 95vw;
    max-height: 95vh;
    width: 1200px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #0f3460;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid #0f3460;
  }
  .modal-header h2 {
    font-size: 20px;
    color: #e94560;
  }
  .modal-header .counter {
    color: #8899aa;
    font-size: 14px;
  }
  .modal-close {
    background: none;
    border: none;
    color: #8899aa;
    font-size: 28px;
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
    min-width: 44px;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-close:hover { color: #e94560; }

  .modal-body {
    flex: 1;
    overflow: auto;
    display: flex;
    flex-direction: column;
  }
  .modal-tabs {
    display: flex;
    gap: 2px;
    padding: 12px 24px 0;
  }
  .modal-tab {
    padding: 8px 20px;
    border: none;
    background: #0f3460;
    color: #8899aa;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 8px 8px 0 0;
    transition: all 0.2s;
    min-height: 44px;
  }
  .modal-tab.active { background: #1a1a2e; color: #e94560; }

  .modal-content {
    flex: 1;
    overflow: auto;
    background: #fff;
    margin: 0 24px 24px;
    border-radius: 0 8px 8px 8px;
  }
  .modal-content.ascii-view {
    background: #1a1a2e;
    padding: 16px;
  }
  .modal-content.ascii-view pre {
    font-size: 11px;
    line-height: 1.3;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    white-space: pre;
  }
  .modal-content img {
    width: 100%;
    height: auto;
    display: block;
  }

  .modal-nav {
    display: flex;
    justify-content: space-between;
    padding: 0 24px 16px;
  }
  .nav-btn {
    padding: 10px 24px;
    border: 1px solid #0f3460;
    background: #16213e;
    color: #e0e0e0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    min-height: 44px;
    min-width: 44px;
  }
  .nav-btn:hover { border-color: #e94560; color: #e94560; }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  .kbd-hints {
    text-align: center;
    padding: 8px;
    color: #556;
    font-size: 12px;
  }
  kbd {
    background: #0f3460;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    color: #aab;
  }

  /* Mobile responsive */
  @media (max-width: 768px) {
    header {
      padding: 14px 16px;
      flex-direction: column;
      gap: 8px;
    }
    header h1 { font-size: 20px; }
    .kbd-hints { display: none; }
    .tab-bar {
      padding: 0 16px 10px;
      overflow-x: auto;
    }
    .tab {
      padding: 8px 16px;
      font-size: 13px;
      white-space: nowrap;
    }
    .gallery-container {
      padding: 16px;
    }
    .card-grid {
      grid-template-columns: 1fr;
      gap: 16px;
    }
    .card .preview {
      height: 200px;
    }
    .modal {
      max-width: 100vw;
      max-height: 100vh;
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      border: none;
    }
    .modal-header {
      padding: 12px 16px;
    }
    .modal-header h2 {
      font-size: 16px;
    }
    .modal-tabs {
      padding: 8px 16px 0;
    }
    .modal-content {
      margin: 0 16px 16px;
    }
    .modal-content.ascii-view pre {
      font-size: 8px;
      line-height: 1.2;
    }
    .modal-nav {
      padding: 0 16px 12px;
    }
    .nav-btn {
      padding: 10px 16px;
      font-size: 13px;
    }
  }

  @media (max-width: 480px) {
    .card .preview {
      height: 160px;
    }
    .modal-content.ascii-view pre {
      font-size: 6px;
      line-height: 1.1;
    }
  }
</style>
</head>
<body>

<header>
  <h1>Devotchi <span>Case Design Gallery</span></h1>
  <div class="kbd-hints">
    <kbd>&larr;</kbd> <kbd>&rarr;</kbd> navigate &nbsp;
    <kbd>Esc</kbd> close &nbsp;
    <kbd>T</kbd> toggle SVG/ASCII
  </div>
</header>

<div class="tab-bar">
  <button class="tab active" data-category="all">All Designs</button>
  <button class="tab" data-category="desktop">Desktop (6)</button>
  <button class="tab" data-category="portable">Portable (10)</button>
</div>

<div class="gallery-container">
  <div class="card-grid" id="cardGrid"></div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Design Name</h2>
      <div>
        <span class="counter" id="modalCounter">1 / 16</span>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-tabs">
        <button class="modal-tab active" data-view="svg">SVG Drawing</button>
        <button class="modal-tab" data-view="ascii">ASCII Concept</button>
      </div>
      <div class="modal-content" id="modalContent"></div>
    </div>
    <div class="modal-nav">
      <button class="nav-btn" id="prevBtn">&larr; Previous</button>
      <button class="nav-btn" id="nextBtn">Next &rarr;</button>
    </div>
  </div>
</div>

    asciiData: `DESIGN 3: FLOATING ORB
======================
Egg-shaped head on a cylindrical pedestal base. Screen embedded
in the flat-cut top of the egg. Think "desk toy" or "smart speaker"
form factor. Two-piece egg + separate base.

Overall: ~80mm egg dia x ~55mm egg height, 65mm base dia x 40mm base height
Total height: ~110mm (base + peg + egg)
Target user: conversation piece, living room display

FRONT VIEW (looking at egg from the side)
─────────────────────────────────────────

              ┌─ Screen window ─┐
           ┌──┤  (41.8x31.6mm) ├──┐
          /   └─────────────────┘   \\
         /   ┌───────────────────┐   \\
        │    │   TFT LCD SCREEN  │    │    ← Egg: ~80mm wide
        │    │  (flat cut on top)│    │       ~55mm tall (oblate)
         \\   └───────────────────┘   /
          \\                         /
           \\───────────┬───────────/
                       │               ← Peg: 8mm dia, 15mm tall
                       │
            ┌──────────┴──────────┐
            │                     │    ← Base: 65mm dia cylinder
            │    PEDESTAL BASE    │       40mm tall
            │  ┌───────────────┐  │
            │  │  speaker      │  │    ← Speaker fires out side
            │  │  grille ○○○○  │  │       through grille holes
            │  └───────────────┘  │
            │      ┌─────┐        │    ← USB-C on base side
            │      │USB-C│        │
            └─────────────────────┘
                 4x rubber feet


SIDE VIEW (same — it's round)
─────────────────────────────
    Same as front view. The egg is rotationally symmetric
    except for the flat screen cut and button placement.


TOP VIEW (looking down at screen face)
──────────────────────────────────────

                 ┌────────────────┐
              ┌──┤                ├──┐
            /    │  TFT SCREEN    │    \\
           /     │ 40.8 x 30.6   │     \\
          │      │   active area  │      │
          │      │                │      │    ~80mm egg diameter
           \\     └────────────────┘     /
            \\    (●)(●)(●)(●)          /     ← 4 buttons around screen
              \\                      /          or on egg equator
                ──────────────────


CROSS-SECTION (cut through center vertically)
─────────────────────────────────────────────

    ┌─ Screen window ─┐
    │                  │
    ┌──────────────────────────┐ ── Egg shell (2mm wall)
    │  ┌─ Screen ───────────┐  │
    │  │  (4.5mm module)    │  │
    │  ├────────────────────┤  │
    │  │  2.5mm gap         │  │    Egg interior:
    │  ├─ PCB ──────────────┤  │    screen + PCB stacked
    │  │  (1.6mm)           │  │    inside upper half
    │  │  ↕ standoffs       │  │
    │  └────────────────────┘  │
    │                          │
    └──────────┬───────────────┘ ── Egg bottom (2mm wall)
               │ PEG (8mm dia)
               │ 15mm tall
    ┌──────────┴───────────────┐ ── Base top plate
    │  ┌───────────────────┐   │
    │  │   SPEAKER          │  │    Base interior:
    │  │   (28mm, 5mm tall) │  │    speaker + USB-C board
    │  ├────────────────────┤  │
    │  │   wiring channel   │  │
    │  └────────────────────┘  │
    └──────────────────────────┘ ── Base bottom plate
         4x rubber feet


COMPONENT LAYOUT
────────────────

    EGG — FRONT HALF (top half of egg)
    ├── Flat-cut top face with screen window
    ├── Screen pocket (52.2 x 36.6mm, depth = module thickness)
    ├── 4x retention clips holding screen in pocket
    ├── Button holes on equator band (4x, 5mm dia)
    └── Shell wall: 2mm, spherical profile

    EGG — BACK HALF (bottom half of egg)
    ├── 4x PCB standoffs (5mm OD, M2, 3mm tall)
    ├── Peg socket (8mm hole, 10mm deep) for base connection
    ├── Wire channel from peg socket to PCB area
    └── Shell wall: 2mm

    PEDESTAL BASE
    ├── Cylinder: 65mm OD, 40mm tall
    ├── Peg on top (8mm dia, 15mm tall) — friction fit into egg
    ├── Speaker cavity inside (28mm dia, 6mm deep)
    ├── Speaker grille on side wall
    ├── USB-C cutout on side wall (9.5 x 3.5mm)
    ├── Wire channel from peg through to internal USB-C breakout
    └── 4x rubber feet on bottom


WIRING NOTES
────────────
- FPC from screen → PCB in egg (short, direct connection)
- USB-C on base connects via wire through hollow peg to PCB in egg
- Speaker in base connects via wire through hollow peg
- Peg is hollow (5mm bore) for wire routing
- Alternative: all electronics in base, only screen+FPC in egg


ASSEMBLY
────────
- Egg: 2 halves (horizontal split at equator), 4x M2 screws
- Base: 2 pieces (top plate + cylinder body), snap-fit or 3x screws from bottom
- Egg sits on base peg (friction fit, can lift off)
- Total 3 subassemblies

    asciiData: `DESIGN 1: CLASSIC EGG
=====================
Original Tamagotchi-inspired egg/oval shape. Portrait orientation.
Rounded top, flatter bottom. Screen in upper half, buttons below.
Think "1996 Bandai Tamagotchi" scaled up for a real TFT display.

Overall: 70mm tall x 55mm wide x 15.1mm deep
Weight target: ~45g with battery
Orientation: Portrait
Shell: 2-piece (front + back), snap-fit tabs

buttons on either side. Comfortable two-hand hold like a tiny game
controller. Think "GameBoy Micro" or "Analogue Pocket" miniaturized.

Overall: 95mm wide x 55mm tall x 16mm deep
Weight target: ~50g with battery
Orientation: Landscape
Corner radius: 5mm
Shell: 2-piece (front + back), 4x M2 screws

COMPONENT LAYOUT (exploded, front to back)
──────────────────────────────────────────

    Layer 1 — FRONT SHELL (1.5mm wall, 5mm corner radius)
    ├── Screen window cutout (41.8 x 31.6mm, landscape, centered)
    ├── 4x button holes (12.5 x 6.5mm, 2 left + 2 right)
    ├── 1x LED hole (2mm dia, bottom-right of screen area)
    ├── 4x screen retention clips (L-shaped, 0.5mm overhang)
    ├── Grip texture zones: 2x recessed areas (15 x 25mm)
    │   with 0.5mm deep cross-hatch pattern on left/right edges
    └── 4x M2 threaded inserts (heat-set, brass)

    Layer 2 — DISPLAY MODULE (51.8 x 36.2 x 2.5mm)
    ├── Landscape orientation (native, no rotation needed)
    ├── Seated in pocket with 0.2mm clearance per side
    ├── FPC cable exits bottom edge
    └── Held by front shell retention clips

    Layer 3 — 2.5mm AIR GAP
    ├── FPC cable routes to PCB connector
    └── Button plungers pass through

    Layer 4 — PCB (45 x 40 x 1.6mm)
    ├── ESP32-S3-MINI-1 (15.4 x 20.5mm) faces back
    ├── 4x tactile switches face front (2 left, 2 right of center)
    ├── USB-C connector on bottom edge (centered)
    ├── Display FPC connector on top edge
    ├── Vibration motor pads (bottom-left area)
    ├── Optional piezo speaker pads (center-back area)
    └── Mounted on 4x M2 standoffs (5mm OD, 2.5mm tall)

    Layer 5 — 0.5mm GAP + BATTERY (30 x 35 x 5mm LiPo)
    ├── Battery offset to one side of ESP32 module
    ├── JST connector pigtail to PCB
    └── Foam tape pad on back shell for retention

    Layer 6 — BACK SHELL (1.5mm wall, 5mm corner radius)
    ├── 4x M2 screw pass-through holes (countersunk)
    ├── 4x standoff bosses (5mm OD, mate with PCB standoffs)
    ├── Battery retention foam pad area
    ├── USB-C cutout (9.5 x 4.0mm)
    └── Optional speaker grille (15 x 8mm, 1mm holes)

    Right buttons centered at X=80mm from left edge

    │░░░░░│              │░░░░░│
    │░░░░░│ ← 0.5mm     │░░░░░│
    │░░░░░│   recessed   │░░░░░│
    │░░░░░│   cross-     │░░░░░│
    │░░░░░│   hatch      │░░░░░│
    ╰─────╯              ╰─────╯
    Left grip            Right grip
    15 x 25mm            15 x 25mm

    Grip zones on front shell only, flanking the buttons.
    Pattern: 45-degree cross-hatch, 1.5mm pitch, 0.5mm deep.


MOUNTING / ASSEMBLY NOTES
─────────────────────────
- Shell: 2-piece rectangle (front + back), 4x M2 screws from back
- Front shell has heat-set brass threaded inserts (M2 x 3mm)
- Display press-fits into front shell pocket, held by retention clips
- PCB sits on 4x standoffs molded into back shell
- Battery secured with double-sided foam tape to back shell
- USB-C cutout spans both shell halves at bottom center
- Grip texture molded into front shell (no separate grip pads)
- 5mm corner radius on all 4 corners, consistent front and back
- Comfortable two-hand hold: index fingers rest on top edge,
  thumbs reach buttons naturally on left and right
- Speaker grille on back is optional — can be solid panel instead
- Total depth 16mm allows 0.9mm extra for standoff bosses and tolerance

    asciiData: `DESIGN 3: PEBBLE

MOUNTING / ASSEMBLY NOTES
─────────────────────────
- Shell: 2-piece rounded rectangle, 4x M2 screws from back
- 10mm corner radius gives very soft, organic look
- Front face completely clean — no visible buttons or holes (except screen)
- All 4 buttons on side edges, using right-angle tactile switches
- Side button caps are separate pieces that slide into shell slots
- LED hidden behind translucent plastic strip at top edge
- PCB requires right-angle switches on both left and right edges
- USB-C cutout on bottom edge, accessible when worn on wrist
- Back shell variant system: swap back shells for different

the screen, lower half has buttons and decoration. Piano hinge along
the middle with ribbon cable pass-through. Magnetic latch keeps it
shut. Think "flip phone" or "Nintendo DS Lite" form factor.

    asciiData: `DESIGN 5: KEYCHAIN POD
======================
Ultra-compact square pod with heavily rounded corners, almost circular.
Integrated carabiner/keyring loop at top. Screen fills most of the front.
Designed to clip onto keys, bags, or belt loops. Chunky and pocket-friendly.
Think "AirTag meets Tamagotchi" — a thick, rounded puck with a screen.

Overall body: 55mm x 55mm x 18mm deep
With carabiner loop: 55mm x 65mm x 18mm (loop adds 10mm at top)
Weight target: ~48g with battery
Orientation: Portrait (slightly taller active area than wide)
Corner radius: 12mm (very round, almost circular)
Shell: 2-piece (front + back), 4x M2 screws

================================================================================
  MOUNTING & ASSEMBLY DETAILS
================================================================================

  Display Mounting:
  - Display module sits in a recessed pocket in front shell
  - Pocket depth: 2.5mm, sized 52.0 x 36.4mm (0.1mm clearance)
  - Held in place by foam tape on back + PCB standoffs pressing against it
  - FPC ribbon folds down and connects to PCB below

  PCB Mounting:
  - 4x M2 screw bosses molded into back shell
  - PCB has 4 mounting holes at corners
  - Standoffs: 3.0mm tall (sets PCB-to-display gap)
  - Screws: M2 x 5mm pan head (from back, through shell into PCB)

  Battery Mounting:
  - Double-sided foam tape to back shell interior
  - Wires routed to PCB connector, strain-relieved with adhesive

  Button Mounting:
  - Tactile switches soldered to PCB
  - Button caps press-fit into front shell holes
  - Caps have internal posts that align with switch actuators
  - Beveled caps: 12 x 6mm top surface, 1mm bevel on all edges
  - Travel: ~0.5mm

  Wake Button:
  - Side-mounted tactile switch on PCB edge
  - Small rocker cap (10 x 4.5mm) press-fit into side cutout
  - Recessed 0.5mm below surface to prevent accidental activation

  Belt Clip:
  - Spring steel clip (0.5mm thick, 20mm wide)
  - Riveted or press-fit into molded pocket on back shell
  - Clip extends ~30mm from body, springs back to ~5mm gap
  - Optional: belt clip is removable (2x micro screws)

  Shell Assembly:
  - Front and back shell snap-fit with 4 internal clips
  - Additional 2x screws at bottom for security (hidden by rubber feet)
  - Gasket: thin foam strip around perimeter for rattle-free fit

================================================================================
  SPECIAL FEATURES
================================================================================

  1. Status LED: RGB LED behind 2mm light-pipe hole, top-left of screen
     - Visible even when device is clipped to belt
     - Pulses gently for notifications

  2. Belt Clip: Integrated spring-steel clip for belt/pocket mounting
     - Rotates slightly for angle adjustment
     - Strong enough for daily carry

  3. Wedge Taper: Bottom is 2mm thicker than top
     - Natural forward-tilt when held or on desk
     - Better screen viewing angle
     - More room at bottom for USB-C connector

  4. Curved Back: 2mm convex dome
     - Comfortable against hip when belt-clipped
     - Prevents rocking on flat surfaces (sits on corner edges)

  5. Vibration Motor: 6mm coin motor on PCB
     - Notification haptics (approval requests, status changes)
     - Pager-authentic buzz feel

  6. Pager Aesthetic:
     - Matte black or dark gray shell
     - Subtle horizontal ridges on sides (grip texture)
     - Small "DEVOTCHI" text debossed on front, below buttons
     - Period-appropriate design language (rounded rectangle, no curves)

================================================================================
  MOUNTING & ASSEMBLY DETAILS
================================================================================

  Display Mounting:
  - Recessed pocket in front shell: 52.0 x 36.4mm, 2.5mm deep
  - Thin foam frame around display for shock absorption
  - Display pressed in from inside, held by PCB standoffs

  PCB Mounting:
  - 4x snap-in clips molded into body (no screws for PCB)
  - PCB slides in from bottom, clips engage at top
  - This allows compact assembly in tight enclosure

  Battery Mounting:
  - Foam tape to back shell
  - JST connector to PCB, tucked alongside battery

  Button Mounting:
  - Located below lid line (always accessible)
  - Caps: 12 x 6mm, standard profile
  - Tactile switches on PCB, caps press-fit in shell

  Wake Button:
  - Right side, ~30mm from top
  - Small rocker cap: 10 x 4.5mm
  - Recessed to prevent accidental press in pocket

  Hinge Assembly:
  - Hinge posts molded into front shell and lid
  - Stainless steel pin pressed through both
  - Torsion spring wrapped around pin
  - Assembly: insert spring, align lid, press pin through

  Shell Assembly:
  - Front and back shells clip together
  - 2x M2 screws at bottom for security
  - Lid attaches to front shell via hinge before final assembly

  USB-C:
  - Bottom center, 9.34 x 3.66mm cutout
  - Accessible whether lid is open or closed

================================================================================
  SPECIAL FEATURES
================================================================================

  1. Flip Lid: Protects screen when closed, satisfying snap-open action
     - Over-center spring detent holds lid firmly open or closed
     - Inner lid lining (felt/rubber) prevents screen scratches
     - Decorative outer plate: brushed metal look

  2. Ultra-Compact: 65 x 45 x 18mm fits in any pocket
     - Similar size to actual Zippo lighter
     - One-hand operable (flip open with thumb)

  3. Decorative Front Plate Options:
     - Brushed aluminum insert with etched Devotchi logo
     - Or: textured plastic with metallic paint
     - Or: clear window showing screen even when closed (defeats purpose
       but looks cool)

  4. Pocket-Friendly: No protrusions, rounded edges
     - Smooth sides, no belt clip
     - Can stand upright on bottom edge (USB-C acts as base notch)

  5. Satisfying Mechanics:
     - Lid snap-open has tactile + audible click
     - Reminiscent of Zippo opening sound
     - Vibration motor enhances the physical feel

  6. Open/Closed Detection:
     - Small magnet in lid + Hall effect sensor on PCB
     - Screen turns off when lid closed (power saving)
     - Wake on lid open (instant-on feel)

  - Pocket walls prevent lateral movement
  - Foam pad on top (between battery and PCB)
  - JST connector, short lead

  - Standard tactile switches on PCB

  - Front and back shells each have half the slot
  - When assembled, slot is complete
  - Internal reinforcement ribs for strength

  Shell Assembly:
  - Front and back shells snap together
  - Perimeter snap clips (6 points)
  - 2x M2 screws near bottom for security
  - Thin foam gasket around perimeter

  - Screws hidden under rubber plugs (clean look)
  - No snap clips (screws only -- solid, no rattles)
  - Thin silicone gasket at shell seam

  - Seam runs around perimeter, follows rounded edges

let currentCategory = 'all';
let filteredDesigns = [...designs];
let currentIndex = 0;
let currentView = 'svg';

// --- Tab filtering ---
document.querySelectorAll('.tab-bar .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab-bar .tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentCategory = tab.dataset.category;
    renderGrid();
  });
});

// --- Render card grid ---
function renderGrid() {
  filteredDesigns = currentCategory === 'all'
    ? [...designs]
    : designs.filter(d => d.category === currentCategory);

  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';

  filteredDesigns.forEach((d, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    const icon = d.category === 'desktop' ? '&#x1f5a5;' : '&#x1f4f1;';
    card.innerHTML = `
      <div class="preview">
        <img src="${d.svgData}" alt="${d.name}">
      </div>
      <div class="info">
        <h3>${icon} ${d.name}</h3>
        <div class="dims">${d.dims}</div>
        <div class="desc">${d.desc}</div>
      </div>
    `;
    card.addEventListener('click', () => openModal(i));
    grid.appendChild(card);
  });
}

// --- Modal ---
function showContent() {
  const d = filteredDesigns[currentIndex];
  const el = document.getElementById('modalContent');

  document.querySelectorAll('.modal-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === currentView);
  });

  if (currentView === 'svg') {
    el.className = 'modal-content';
    el.innerHTML = `<img src="${d.svgData}" alt="${d.name}" style="background:#fff">`;
  } else {
    el.className = 'modal-content ascii-view';
    const escaped = d.asciiData.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    el.innerHTML = `<pre>${escaped || 'ASCII data not available.'}</pre>`;
  }
}

function openModal(index) {
  currentIndex = index;
  currentView = 'svg';
  updateModal();
  document.getElementById('modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  document.body.style.overflow = '';
}

function updateModal() {
  const d = filteredDesigns[currentIndex];
  const icon = d.category === 'desktop' ? '\u{1f5a5}' : '\u{1f4f1}';
  document.getElementById('modalTitle').textContent = icon + ' ' + d.name;
  document.getElementById('modalCounter').textContent =
    (currentIndex + 1) + ' / ' + filteredDesigns.length;
  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').disabled = currentIndex === filteredDesigns.length - 1;
  showContent();
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});
document.getElementById('prevBtn').addEventListener('click', () => {
  if (currentIndex > 0) { currentIndex--; updateModal(); }
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (currentIndex < filteredDesigns.length - 1) { currentIndex++; updateModal(); }
});

document.querySelectorAll('.modal-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    currentView = tab.dataset.view;
    showContent();
  });
});

// --- Keyboard navigation ---
document.addEventListener('keydown', e => {
  const modal = document.getElementById('modal');
  if (!modal.classList.contains('active')) return;

  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft' && currentIndex > 0) { currentIndex--; updateModal(); }
  if (e.key === 'ArrowRight' && currentIndex < filteredDesigns.length - 1) { currentIndex++; updateModal(); }
  if (e.key === 't' || e.key === 'T') {
    currentView = currentView === 'svg' ? 'ascii' : 'svg';
    showContent();
  }
});

// --- Touch/Swipe gesture support ---
(function() {
  let touchStartX = 0;
  let touchStartY = 0;
  let touchEndX = 0;
  let touchEndY = 0;
  const minSwipeDistance = 50;

  const modalEl = document.getElementById('modal');

  modalEl.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });

  modalEl.addEventListener('touchend', e => {
    touchEndX = e.changedTouches[0].screenX;
    touchEndY = e.changedTouches[0].screenY;
    handleSwipe();
  }, { passive: true });

  function handleSwipe() {
    const dx = touchEndX - touchStartX;
    const dy = touchEndY - touchStartY;

    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > minSwipeDistance) {
      if (dx > 0 && currentIndex > 0) {
        currentIndex--;
        updateModal();
      } else if (dx < 0 && currentIndex < filteredDesigns.length - 1) {
        currentIndex++;
        updateModal();
      }
    }
  }
})();

// Init
renderGrid();
</script>
